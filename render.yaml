# =============================================================================
# Render blueprint - KMFRI Scientists & Research Management System
# =============================================================================
# The JSON data store lives on a Persistent Disk, because Render's default
# filesystem is ephemeral and every deploy would otherwise wipe all records.
#
# Persistent Disks require a paid instance type (Starter and up). On a free
# instance set KMFRI_DATA_DIR to an empty value so the store falls back to the
# ephemeral ./data directory, and enable SUPABASE_MIRROR_ENABLED=true once the
# Postgres mirror is verified so records are recoverable from the mirror.
#
# DATA PERSISTENCE ON FREE TIER:
# - Local JSON (data/kmfri_db.json, data/kmfri_auth.json) is EPHEMERAL - wiped on every deploy
# - Supabase mirror (SUPABASE_MIRROR_ENABLED=true) persists to PostgreSQL
# - Run supabase/migrations/0001_kmfri_schema.sql in Supabase SQL Editor first
# - If mirror fails, data is lost on deploy. Upgrade to Starter plan for persistent disk.
# =============================================================================

services:
  - type: web
    name: kmfri-research-management
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true

    # npm ci installs dependencies; npm run build produces dist/ (client bundle
    # plus the esbuild server bundle). dist/ is gitignored, so the build step
    # is mandatory - without it the start command has no dist/server.js.
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: node dist/server.js

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: "production"
      - key: NODE_VERSION
        value: "22.18.0"

      # Free tier: no persistent disk. Empty KMFRI_DATA_DIR falls back to ./data (ephemeral).
      # Enable Supabase mirror so records survive deploys via Postgres.
      - key: KMFRI_DATA_DIR
        value: ""
      - key: SESSION_SECRET
        generateValue: true
      - key: KMFRI_ALLOW_ROLE_SWITCH
        value: "false"
      - key: SUPABASE_MIRROR_ENABLED
        value: "true"

      # SMTP Configuration (set these in Render dashboard for email delivery)
      #   SMTP_HOST (e.g. smtp.gmail.com, smtp.office365.com)
      #   SMTP_PORT (587 for TLS, 465 for SSL)
      #   SMTP_USER (email address)
      #   SMTP_PASS (app password or SMTP password)
      #   SMTP_FROM (optional, default: "KMFRI System <SMTP_USER>")

      # Secrets: set these in the Render dashboard (they must not be committed).
      #   GEMINI_API_KEY
      #   KMFRI_INITIAL_ADMIN_PASSWORD  (>= 12 chars; otherwise generated and logged)
      #   NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY