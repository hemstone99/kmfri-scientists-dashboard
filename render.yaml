# Render Blueprint for KMFRI Scientists & Research Management Dashboard
# Full-stack Render web service backed by Supabase PostgreSQL.

services:
  # Serves both the React app and API from one Render web service.
  - type: web
    name: kmfri-research-portal-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Paste your Supabase Transaction/Session Pooler URI (postgresql://postgres.[ref]:[password]@aws-0-eu-west-2.pooler.supabase.com:6543/postgres)
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
