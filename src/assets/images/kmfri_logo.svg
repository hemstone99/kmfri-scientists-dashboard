<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter for 3D Letters -->
    <filter id="kmfriLetterShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="65" cy="70" r="48"/>
    </clipPath>
  </defs>

  <!-- ==================== EMBLEM (LEFT) ==================== -->
  <!-- Inner circular scene -->
  <g clip-path="url(#circleClip)">
    <!-- Sky background -->
    <rect x="15" y="20" width="100" height="60" fill="#f0f9ff"/>
    
    <!-- Ocean waves -->
    <path d="M 15 72 Q 35 64 55 70 T 95 68 T 115 72 L 115 120 L 15 120 Z" fill="url(#oceanGradient)"/>
    <path d="M 15 82 Q 40 76 65 82 T 115 80 L 115 120 L 15 120 Z" fill="#0284c7" opacity="0.9"/>
    <path d="M 15 94 Q 45 88 75 94 T 115 92 L 115 120 L 15 120 Z" fill="#0369a1"/>

    <!-- White Sea Spray / Foam -->
    <path d="M 40 74 Q 45 70 50 74 Q 55 70 60 74" stroke="#ffffff" stroke-width="1.2" fill="none"/>
    <path d="M 75 73 Q 80 69 85 73 Q 90 69 95 73" stroke="#ffffff" stroke-width="1.2" fill="none"/>

    <!-- RV Mtafiti Research Vessel (Center) -->
    <g id="ship">
      <!-- Radar Mast -->
      <line x1="65" y1="42" x2="65" y2="48" stroke="#3b5bdb" stroke-width="2"/>
      <line x1="61" y1="44" x2="69" y2="44" stroke="#3b5bdb" stroke-width="1.5"/>
      <circle cx="65" cy="42" r="1.5" fill="#ef4444"/>
      <!-- Wheelhouse / Superstructure -->
      <rect x="57" y="48" width="16" height="12" rx="1.5" fill="#ffffff" stroke="#3b5bdb" stroke-width="1.2"/>
      <rect x="59" y="50" width="4" height="4" fill="#0284c7"/>
      <rect x="65" y="50" width="4" height="4" fill="#0284c7"/>
      <!-- Lower deck -->
      <path d="M 52 60 L 78 60 L 76 65 L 54 65 Z" fill="#ffffff" stroke="#3b5bdb" stroke-width="1.2"/>
      <!-- Ship Hull (Cutting through water) -->
      <path d="M 46 65 L 84 65 L 77 78 Q 65 82 53 78 Z" fill="#3b5bdb" stroke="#1d4ed8" stroke-width="1.2"/>
      <!-- Bow White stripe -->
      <path d="M 49 68 L 81 68" stroke="#ffffff" stroke-width="1.2"/>
    </g>

    <!-- Optical Microscope (Left of ship) -->
    <g id="microscope" transform="translate(32, 45) scale(0.65)">
      <!-- Base -->
      <rect x="6" y="38" width="16" height="4" rx="1" fill="#0f172a"/>
      <!-- Arm / Pillar -->
      <path d="M 18 38 C 22 30 20 18 14 12" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Eyepiece & Tube -->
      <rect x="6" y="8" width="5" height="13" rx="1" transform="rotate(28 6 8)" fill="#0f172a"/>
      <!-- Objective Lenses & Nosepiece -->
      <circle cx="13" cy="23" r="2.5" fill="#3b5bdb"/>
      <rect x="12" y="24" width="3" height="5" transform="rotate(28 12 24)" fill="#3b5bdb"/>
      <!-- Specimen Stage -->
      <rect x="7" y="28" width="11" height="2.5" rx="0.5" fill="#475569"/>
    </g>

    <!-- Mangrove / Wetland Vegetation (Right of ship) -->
    <g id="mangrove" transform="translate(82, 48) scale(0.68)">
      <!-- Green Leaves / Foliage -->
      <ellipse cx="14" cy="12" rx="9" ry="7" fill="#15803d"/>
      <ellipse cx="8" cy="8" rx="7" ry="5.5" fill="#16a34a"/>
      <ellipse cx="20" cy="9" rx="6.5" ry="5" fill="#22c55e"/>
      <ellipse cx="14" cy="6" rx="5" ry="4" fill="#4ade80"/>
      <!-- Stem & Stilt Prop Roots -->
      <path d="M 14 16 L 14 26" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
      <path d="M 14 23 Q 8 29 4 36" stroke="#92400e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M 14 23 Q 20 29 24 36" stroke="#92400e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M 13 25 Q 11 31 10 38" stroke="#78350f" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M 15 25 Q 17 31 18 38" stroke="#78350f" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Top Blue Leaping Fish (Arches over top, clockwise/rightward) -->
  <g id="blueFish">
    <!-- Body -->
    <path d="M 22 56 C 24 24 62 14 96 22 C 112 26 122 36 126 48 C 118 42 106 32 86 28 C 58 24 32 36 22 56 Z" fill="#3b5bdb"/>
    <!-- Tail Fin (Left) -->
    <path d="M 22 56 L 8 46 C 11 55 10 62 4 70 L 17 64 C 19 61 21 58 22 56 Z" fill="#3b5bdb"/>
    <!-- Head & Open Mouth (Right) -->
    <path d="M 126 48 C 129 53 127 58 120 62 C 120 56 116 53 113 51 Z" fill="#3b5bdb"/>
    <!-- Eye -->
    <circle cx="116" cy="42" r="3" fill="#ffffff"/>
    <circle cx="116" cy="42" r="1.5" fill="#0f172a"/>
    <!-- Dorsal Fin -->
    <path d="M 58 17 Q 72 10 86 17 Z" fill="#2563eb"/>
    <!-- Ventral / Pectoral Fin -->
    <path d="M 98 28 Q 106 24 110 32 Z" fill="#2563eb"/>
  </g>

  <!-- Bottom Black Leaping Fish (Arches under bottom, leftward) -->
  <g id="blackFish">
    <!-- Body -->
    <path d="M 108 84 C 106 116 68 126 34 118 C 18 114 8 104 4 92 C 12 98 24 108 44 112 C 72 116 98 104 108 84 Z" fill="#0a0a0a"/>
    <!-- Tail Fin (Right) -->
    <path d="M 108 84 L 122 94 C 119 85 120 78 126 70 L 113 76 C 111 79 109 82 108 84 Z" fill="#0a0a0a"/>
    <!-- Head & Open Mouth (Left) -->
    <path d="M 4 92 C 1 87 3 82 10 78 C 10 84 14 87 17 89 Z" fill="#0a0a0a"/>
    <!-- Eye -->
    <circle cx="14" cy="98" r="3" fill="#ffffff"/>
    <circle cx="14" cy="98" r="1.5" fill="#0f172a"/>
    <!-- Dorsal / Ventral Fin -->
    <path d="M 72 123 Q 58 130 44 123 Z" fill="#171717"/>
    <!-- Pectoral Fin -->
    <path d="M 32 112 Q 24 116 20 108 Z" fill="#171717"/>
  </g>

  <!-- ==================== LOGO TYPOGRAPHY (RIGHT) ==================== -->
  <!-- Bold Royal Blue Letters KMFR / KMFRI with 3D Drop Shadow -->
  <g filter="url(#kmfriLetterShadow)">
    <text x="145" y="90" font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" font-weight="900" font-size="78" fill="#3b5bdb" letter-spacing="-2">KMFR</text>
    <text x="440" y="90" font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" font-weight="900" font-size="78" fill="#3b5bdb" letter-spacing="-2">I</text>
  </g>

  <!-- Subtitle: Kenya Marine and Fisheries Research Institute -->
  <text x="148" y="116" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="16.5" fill="#000000" letter-spacing="0.2">Kenya Marine and Fisheries Research Institute</text>
</svg>
